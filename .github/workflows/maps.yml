name: Mappe aeroporti
on:
  schedule:
    - cron: '17 3 * * 1'   # ogni lunedì
  workflow_dispatch:
    inputs:
      icao:
        description: 'Codici ICAO separati da spazio (vuoto = tutta la lista)'
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: maps
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/build-maps.mjs ${{ github.event.inputs.icao }}
      - name: Salva le mappe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add data/maps
          git diff --cached --quiet || (git commit -m "Mappe aeroporti aggiornate" && git push && echo CHANGED=1 >> $GITHUB_ENV)
      - name: Ripubblica il sito con le mappe nuove
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
